name: manzanas-maracay-staging
x-runtime: &runtime
  restart: on-failure:3
  init: true
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 160
  logging:
    driver: json-file
    options: {max-size: '5m', max-file: '3'}
  tmpfs: ['/tmp:size=64m,mode=1777']
services:
  postgres:
    image: postgres:18.6-alpine
    restart: on-failure:3
    environment:
      POSTGRES_USER: mm_owner
      POSTGRES_DB: manzanas_maracay_staging
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [owner_password, app_password]
    volumes:
      - mm_staging_pg:/var/lib/postgresql
      - ./infra/init-staging-role.sh:/docker-entrypoint-initdb.d/10-mm-role.sh:ro
    networks: [database]
    command: ['postgres', '-c', 'max_connections=40', '-c', 'shared_buffers=128MB', '-c', 'log_statement=none']
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'mm_owner', '-d', 'manzanas_maracay_staging']
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: '5m', max-file: '3'}
  migrate:
    <<: *runtime
    restart: 'no'
    profiles: [tools]
    image: manzanas-maracay-tools:${MM_RELEASE:?Identifica la versión}
    build: {context: ., dockerfile: infra/Dockerfile, target: tools, args: {MM_RELEASE: "${MM_RELEASE:?Identifica la versión}"}}
    environment:
      MM_APP_ENV: staging
      MM_APP_ORIGIN: ${MM_APP_ORIGIN:?Configura el dominio HTTPS confirmado}
      MM_PG_PASSWORD_FILE: /run/secrets/owner_password
      MM_PRIVATE_DIR: /run/secrets
    secrets: [owner_password, invitation]
    networks: [database]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 512m
    cpus: 1.0
  api:
    <<: *runtime
    image: manzanas-maracay-api:${MM_RELEASE:?Identifica la versión}
    build: {context: ., dockerfile: infra/Dockerfile, target: api, args: {MM_RELEASE: "${MM_RELEASE:?Identifica la versión}"}}
    environment:
      MM_APP_ENV: staging
      MM_APP_ORIGIN: ${MM_APP_ORIGIN:?Configura el dominio HTTPS confirmado}
      MM_API_HOST: 0.0.0.0
      MM_API_PORT: '3101'
      MM_APP_PASSWORD_FILE: /run/secrets/app_password
      MM_INTERNAL_TOKEN_FILE: /run/secrets/internal_token
    secrets: [app_password, internal_token]
    networks: [database, application]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3101/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
    mem_limit: 512m
    cpus: 1.0
  mm-staging-web:
    <<: *runtime
    image: manzanas-maracay-web:${MM_RELEASE:?Identifica la versión}
    build: {context: ., dockerfile: infra/Dockerfile, target: web, args: {MM_RELEASE: "${MM_RELEASE:?Identifica la versión}"}}
    environment:
      MM_APP_ENV: staging
      MM_APP_ORIGIN: ${MM_APP_ORIGIN:?Configura el dominio HTTPS confirmado}
      MM_API_BASE_URL: http://api:3101
      MM_INTERNAL_TOKEN_FILE: /run/secrets/internal_token
    secrets: [internal_token]
    networks:
      application: {}
      edge:
        aliases: [mm-staging-web]
    ports: ['127.0.0.1:33100:3100']
    tmpfs: ['/tmp:size=64m,mode=1777', '/app/apps/web/.next/cache:size=64m,uid=1000,gid=1000,mode=0750']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
    mem_limit: 384m
    cpus: 1.0
networks:
  database: {internal: true}
  application: {internal: true}
  edge: {}
volumes:
  mm_staging_pg: {}
secrets:
  owner_password: {file: '${MM_SECRETS_DIR:?Directorio privado externo}/owner_password'}
  app_password: {file: '${MM_SECRETS_DIR:?Directorio privado externo}/app_password'}
  internal_token: {file: '${MM_SECRETS_DIR:?Directorio privado externo}/internal_token'}
  invitation: {file: '${MM_SECRETS_DIR:?Directorio privado externo}/invitation'}
