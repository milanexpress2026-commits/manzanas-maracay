<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sin conexión | Manzanas Maracay</title>
    <style>
      body {
        font: 18px/1.6 system-ui;
        margin: 0;
        background: #f7f6f0;
        color: #20372c;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      main {
        max-width: 30rem;
        padding: 2rem;
      }
      img {
        display: block;
        width: 160px;
        height: 160px;
        object-fit: contain;
      }
      a {
        display: inline-block;
        background: #123c2c;
        color: white;
        padding: 0.7rem 1rem;
        border-radius: 8px;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #b92f3c;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/brand/logo-manzanas-maracay.webp"
        width="160"
        height="160"
        alt="Manzanas Maracay · Frutas importadas"
      />
      <h1>Necesitas conexión</h1>
      <p>
        Vuelve a conectar el dispositivo y comprueba que la aplicación local esté encendida. Los
        cambios sin guardar no se envían automáticamente.
      </p>
      <a href="/">Volver al catálogo</a>
    </main>
  </body>
</html>
