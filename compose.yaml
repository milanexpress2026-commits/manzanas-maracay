name: manzanas-maracay-dev
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: mm_owner
      POSTGRES_PASSWORD: ${MM_PG_PASSWORD:?Configura la clave del proyecto en .env}
      POSTGRES_DB: manzanas_maracay_dev
      MM_APP_PASSWORD: ${MM_APP_PASSWORD:?Configura la clave de la aplicación}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - mm_pg_data:/var/lib/postgresql
      - ./infra/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mm_owner -d manzanas_maracay_dev']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 1.0
volumes:
  mm_pg_data:
