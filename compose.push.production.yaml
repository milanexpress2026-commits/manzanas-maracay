# Optional production-only push. Independent keys and device registration; never reuse staging.
services:
  api:
    environment:
      MM_VAPID_PUBLIC_KEY_FILE: /run/secrets/vapid_public_key
      MM_VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid_private_key
      MM_VAPID_SUBJECT_FILE: /run/secrets/vapid_subject
    secrets: [vapid_public_key, vapid_private_key, vapid_subject]
    networks:
      database: {}
      application: {}
      push_egress: { gw_priority: 1 }
networks:
  push_egress:
    driver: bridge
    internal: false
    labels: { org.manzanas-maracay.scope: production-push-egress }
secrets:
  vapid_public_key:
    { file: '${MM_PRODUCTION_SECRETS_DIR:?Secretos nuevos de producción}/vapid_public_key' }
  vapid_private_key:
    { file: '${MM_PRODUCTION_SECRETS_DIR:?Secretos nuevos de producción}/vapid_private_key' }
  vapid_subject:
    { file: '${MM_PRODUCTION_SECRETS_DIR:?Secretos nuevos de producción}/vapid_subject' }
